<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pvisual — OMOP Patient Data Visualizer</title>
  <style>
    :root {
      --sidebar-width: 320px;
      --header-height: 56px;
      --bg: #f5f6f8;
      --panel-bg: #ffffff;
      --border: #e0e2e6;
      --text: #1f2328;
      --text-muted: #6a737d;
      --accent: #1f8ac0;
      --visit-inpatient: #3b6fd4;
      --visit-outpatient: #2e8b57;
      --visit-emergency: #d4504e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app { display: flex; flex-direction: column; height: 100vh; }

    header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    #load-btn {
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-bg);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    #load-btn:hover { background: #f0f2f5; }

    #status {
      font-size: 12px;
      color: var(--text-muted);
      flex: 1;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Radial visualization area */
    #radial-container {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--bg);
    }

    #radial-svg {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
    }

    /* Timeline sidebar */
    #timeline {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px 0;
    }

    .timeline-empty {
      padding: 20px;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 900px) {
      main { flex-direction: column; }
      #timeline { width: 100%; height: 35%; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>pvisual</h1>
      <button id="load-btn" title="Load a directory of OMOP export files">Load patient data…</button>
      <div id="status">No data loaded.</div>
    </header>
    <main>
      <div id="radial-container">
        <svg id="radial-svg" role="img" aria-label="Radial visit visualization"></svg>
      </div>
      <aside id="timeline" aria-label="Measurement timeline">
        <div class="timeline-empty">Load a directory of OMOP export files to see the measurement timeline.</div>
      </aside>
    </main>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    (function () {
      'use strict';

      const statusEl = document.getElementById('status');
      const loadBtn = document.getElementById('load-btn');

      function setStatus(text) {
        statusEl.textContent = text;
      }

      if (window.d3) {
        setStatus('D3.js ' + d3.version + ' ready. Load a directory to begin.');
      } else {
        setStatus('Error: D3.js failed to load from CDN. Check network connection.');
      }

      loadBtn.addEventListener('click', function () {
        setStatus('Directory loading will be available in the next development step.');
      });
    })();
  </script>
</body>
</html>
